# Nginx リバースプロキシ（PHP イメージを再ビルドせずバージョンや設定のみ差し替え可能）
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: laravel-pos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../:/var/www/html:ro
      - ../../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - laravel-pos
