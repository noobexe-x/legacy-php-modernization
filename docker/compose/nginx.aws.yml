# ALB からインスタンス 80 を叩く用（ホスト 80 → コンテナ 80）
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: laravel-pos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../:/var/www/html:ro
      - ../../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - laravel-pos
