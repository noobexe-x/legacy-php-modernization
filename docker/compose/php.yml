# PHP-FPM（Laravel アプリケーション）
services:
  php:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    container_name: laravel-pos-php
    restart: unless-stopped
    volumes:
      - ../../:/var/www/html
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_LOCALE: ja
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: ja_JP
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_jquery_pos
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      VITE_APP_NAME: Laravel
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-pos
